[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer-cli"
version = "1.0.0"
description = "Utilitas CLI pengatur file otomatis yang ramah pengguna awam."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0"
]

[project.scripts]
file-org = "organizer.cli:app"

[tool.setuptools.packages.find]
include = ["organizer*"]
